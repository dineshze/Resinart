<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" fill="#f5f5f5" rx="20"/>
  
  <!-- Resin droplet with gradient effect -->
  <defs>
    <linearGradient id="resinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b4d9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d48cc9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b85fb8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main droplet shape -->
  <path d="M 50 15 C 35 30, 25 45, 25 60 C 25 78, 35 85, 50 85 C 65 85, 75 78, 75 60 C 75 45, 65 30, 50 15 Z" fill="url(#resinGradient)"/>
  
  <!-- Shine/highlight -->
  <ellipse cx="42" cy="40" rx="12" ry="18" fill="url(#shine)"/>
  
  <!-- Inner crystal facet -->
  <path d="M 45 35 L 52 48 L 48 52 Z" fill="#ffffff" opacity="0.3"/>
</svg>